name: Publish to Plugin Marketplace
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # lets the run prove which repository and workflow it is
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prusa3d/plugin-marketplace-publish@v1
        with:
          path: . # the folder with manifest.json
          private-key: ${{ secrets.PRUSA_SLICER_PLUGIN_MARKETPLACE_SIGNING_KEY }}
